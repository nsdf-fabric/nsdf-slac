services:
  dashboard:
    image: ghcr.io/nsdf-fabric/nexus-dashboard:0.0.7
    container_name: nexus-dashboard
    env_file:
      - ".env"
    ports:
      - "0.0.0.0:8000:8000"
    restart: always
    volumes:
      - "idx:/usr/src/nexus-dashboard/idx"
    develop:
      watch:
        - action: sync
          path: ./app.py
          target: /usr/src/nexus-dashboard/app.py

volumes:
  idx:
    driver: local
