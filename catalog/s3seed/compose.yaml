services:
  # PostgreSQL database
  postgres:
    image: postgres:17-alpine
    container_name: postgres-server
    env_file:
      - ".env"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 12
    restart: always

volumes:
  postgres_data:
    driver: local
