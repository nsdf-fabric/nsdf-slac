services:
  dashboard:
    image: nsdf-catalog:latest
    container_name: nsdf-catalog-ui
    env_file:
      - ".env"
    ports:
      - "${BOKEH_DEFAULT_SERVER_PORT}:${BOKEH_DEFAULT_SERVER_PORT}"
    restart: always
    depends_on:
      - "postgres"
    develop:
      watch:
        - action: sync
          path: ./catalog.py
          target: /app/catalog.py

  # POSTGRES database
  postgres:
    image: postgres:17-alpine
    container_name: postgres-catalog-server
    env_file:
      - ".env"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_catalog/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 12
    restart: always

  # DB seed
  dbseed:
    image: nsdf-catalog-seed:latest
    container_name: dbseed
    depends_on:
      postgres:
        condition: "service_healthy"
    env_file:
      - ".env"
    restart: no

volumes:
  postgres_data:
    driver: local
