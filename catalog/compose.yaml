services:
  dashboard:
    image: nsdf-catalog:latest
    container_name: nsdf-catalog-ui
    env_file:
      - ".env"
    ports:
      - "10002:10002"
    restart: always
    depends_on:
      - "clickhouse"
    develop:
      watch:
        - action: sync
          path: ./run.py
          target: /app/run.py

  # Clickhouse database
  clickhouse:
    image: clickhouse/clickhouse-server:25.9.3.48
    container_name: clickhouse-server
    env_file:
      - ".env"
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 12
    restart: always

  # DB seed
  dbseed:
    image: nsdf-catalog-seed:latest
    container_name: dbseed
    depends_on:
      clickhouse:
        condition: "service_healthy"
    env_file:
      - ".env"
    restart: no

volumes:
  clickhouse_data:
    driver: local
